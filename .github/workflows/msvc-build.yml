name: msvc-build
on:
  workflow_call:
    inputs:
      backend:
        required: false
        type: string
        default: posix
      target:
        required: false
        type: string
        default: simutrans
      build_type:
        required: false
        type: string
        default: Release
      additional_dependencies:
        required: false
        type: string
        default: ""
jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Init variables
        shell: bash
        run: python ./.github/init_env.py "${{inputs.target}}" "${{inputs.backend}}" "${{inputs.build_type}}" "windows"

      # The runner image provides vcpkg (VCPKG_INSTALLATION_ROOT) and CMake.
      # x64-windows-static-md: static libraries, dynamic CRT (/MD) — matching
      # the project's default MSVC runtime flags. The plain x64-windows-static
      # triplet (/MT) would fail to link against them.
      - name: Install vcpkg dependencies
        shell: pwsh
        run: vcpkg install --triplet x64-windows-static-md zlib bzip2 libpng ${{inputs.additional_dependencies}}

      - name: Create build directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/build"

      - name: Configure Simutrans
        shell: pwsh
        run: cmake .. -DSIMUTRANS_BACKEND=${{inputs.backend}} -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="${env:VCPKG_INSTALLATION_ROOT}\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
        working-directory: ${{ github.workspace }}/build
      - name: Build Simutrans
        run: cmake --build . --target ${{inputs.target}}-extended --config ${{inputs.build_type}}
        working-directory: ${{ github.workspace }}/build

      - name: Upload Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.st_artifact_name}}
          path: ${{ github.workspace }}/${{env.st_artifact_path}}
          if-no-files-found: error
