name: linux-build
on:
  workflow_call:
    inputs:
      backend:
        required: false
        type: string
        default: posix
      target:
        required: false
        type: string
        default: simutrans
      build_type:
        required: false
        type: string
        default: Release
      additional_dependencies:
        required: false
        type: string
        default: ""
      build_sdl3:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Init variables
        shell: bash
        run: python ./.github/init_env.py "${{inputs.target}}" "${{inputs.backend}}" "${{inputs.build_type}}" "linux"

      - name: Setup build environment
        run: |
          sudo apt-get -y update
          sudo apt-get install -y --no-install-recommends build-essential cmake clang-14

      - name: Install dependencies
        run: sudo apt-get install -y --no-install-recommends zlib1g-dev libbz2-dev ${{inputs.additional_dependencies}}

      # Ubuntu 22.04/24.04 do not package SDL3 (verified 2026-09-06 via the Launchpad archive API)
      - name: Build and install SDL3 from source
        if: inputs.build_sdl3
        run: |
          sudo apt-get install -y --no-install-recommends libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev libxss-dev libxtst-dev libxxf86vm-dev libxkbcommon-dev libwayland-dev wayland-protocols libdecor-0-dev libdbus-1-dev libibus-1.0-dev
          git clone --depth 1 --branch release-3.4.16 https://github.com/libsdl-org/SDL.git /tmp/sdl3
          cmake -S /tmp/sdl3 -B /tmp/sdl3-build -DCMAKE_BUILD_TYPE=Release -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF
          cmake --build /tmp/sdl3-build -j $(nproc)
          sudo cmake --install /tmp/sdl3-build

      - name: Create build directory
        run: mkdir build
      - name: Configure Simutrans
        run: CC=clang-14 CXX=clang++-14 cmake .. -DCMAKE_BUILD_TYPE="${{inputs.build_type}}" -DSIMUTRANS_BACKEND=${{inputs.backend}}
        working-directory: ./build

      - name: Build Simutrans
        run: cmake --build . --target ${{inputs.target}}-extended -- -j $(nproc)
        working-directory: ./build

      - name: Upload Artifact (CI)
        uses: actions/upload-artifact@v4
        with:
          name: ${{env.st_artifact_name}}
          path: ${{env.st_artifact_path}}
          if-no-files-found: error
