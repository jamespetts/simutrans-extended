#
# CI for running tests
#
# Blocking gate: the smoke harness (smoke + network determinism on tests/demo.sve, via
# scripts/run-smoke-tests.sh) against the pinned pakset commit in tests/pakset-pin.tab
# (last-known-good ratchet; the pin is advanced only on green runs by pakset-pin.yml).
# The TSan flavour of the same harness runs as its own workflow (tsan-smoke.yml):
# GitHub does not allow continue-on-error on a job that calls a reusable workflow,
# so keeping it in a separate workflow stops any TSan finding from failing this gate.
# It was knowingly red until the karte_t::load/init_threads race family was fixed
# (workers are now created only at the end of karte_t::load; see ai/threading.md);
# it now serves as the regression detector for threading races.
#
# Bypassed for now (user decision 2026-09-07): the legacy Squirrel scenario jobs. The
# suite is deferred; both jobs currently hang until their 10 minute timeout (verified
# 2026-09-07, run 34157611380). They never run on push/PR; the full
# infrastructure stays wired and can be exercised on demand via "Run workflow" with the
# squirrel_tests input ticked (results then report honestly - no continue-on-error).
#
on:
  push:
    branches: [master, ex-15]
  pull_request:
    branches: [master, ex-15]
  workflow_dispatch:
    inputs:
      squirrel_tests:
        description: 'Also run the deferred Squirrel scenario jobs'
        type: boolean
        default: false
name: Automated Tests

jobs:
  resolve-pakset-pin:
    runs-on: ubuntu-latest
    outputs:
      pakset_sha: ${{ steps.pin.outputs.pakset_sha }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Read pin
      id: pin
      run: |
        branch="${{ github.base_ref || github.ref_name }}"
        case "$branch" in
          ex-15) key="ex-15" ;;
          *) key="master" ;;
        esac
        sha=$(awk -F' *= *' -v k="$key" '$1 == k { print $2 }' tests/pakset-pin.tab)
        if [ -z "$sha" ]; then
          echo "::error::no pakset pin for key '$key' in tests/pakset-pin.tab"
          exit 1
        fi
        echo "pakset_sha=$sha" >> "$GITHUB_OUTPUT"
        echo "pakset pin ($key): $sha"

  smoke-harness:
    needs: resolve-pakset-pin
    uses: ./.github/workflows/smoke-harness.yml
    with:
      pakset_sha: ${{ needs.resolve-pakset-pin.outputs.pakset_sha }}
      label: ${{ github.base_ref || github.ref_name }}
      fixture: tests/demo.sve
      until: '1945.6'
      runner_timeout_s: 1800
      job_timeout_minutes: 180

  run-tests-asan-ubsan:
    # Deferred Squirrel suite: on-demand only (workflow_dispatch with the input ticked);
    # bypassed on push/PR. Remove the if: to reinstate permanently.
    if: github.event_name == 'workflow_dispatch' && inputs.squirrel_tests
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -ym install libbz2-dev zlib1g-dev libpng-dev autoconf clang-14 ccache moreutils
    - name: Cache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache:${{ github.job }}:${{ github.ref }}:${{ github.sha }}
        restore-keys: |
          ccache:${{ github.job }}:${{ github.ref }}
          ccache:${{ github.job }}
    - name: Configure Simutrans Build
      run: |
        autoconf
        CC="ccache clang-14" CXX="ccache clang++-14" ./configure
        echo "DEBUG = 2" >> config.default
        echo "FLAGS += -fsanitize=address,undefined -fno-sanitize-recover=all -fno-sanitize=shift,function" >> config.default
        echo "LDFLAGS += -fsanitize=address,undefined" >> config.default
    - name: Build Simutrans
      run: |
        CC="ccache clang-14" CXX="ccache clang++-14" make -j$(nproc)
    - name: Install pak128.britain-ex-nightly
      run: |
        pushd simutrans
        printf '2\ni\ny\n' | ../get_pak.sh
        popd
    - name: Link tests as scenario
      run: |
        mkdir -p ./simutrans/pak128.britain-ex-nightly/scenario
        ln -sT $GITHUB_WORKSPACE/tests ./simutrans/pak128.britain-ex-nightly/scenario/automated-tests
    - name: Create simuconf
      run: |
        mkdir -p ~/simutrans/
        echo "frames_per_second = 100"              >> ~/simutrans/simuconf.tab
        echo "fast_forward_frames_per_second = 100" >> ~/simutrans/simuconf.tab
    - name: Run tests
      run: |
        export ASAN_OPTIONS="print_stacktrace=1 abort_on_error=1 detect_leaks=0"
        export UBSAN_OPTIONS="print_stacktrace=1 abort_on_error=1"
        cp scripts/run-automated-tests.sh .
        chmod +x run-automated-tests.sh
        timeout 10m ./run-automated-tests.sh # 10 minutes ought to be enough for anybody.

  run-tests-tsan:
    # Deferred Squirrel suite (see ai/scripting-and-tests.md): on-demand only
    # (workflow_dispatch with the input ticked); bypassed on push/PR.
    # Remove the if: to reinstate permanently.
    if: github.event_name == 'workflow_dispatch' && inputs.squirrel_tests
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get -y update
        sudo apt-get -ym install libbz2-dev zlib1g-dev libpng-dev autoconf clang-14 ccache moreutils
    - name: Cache
      uses: actions/cache@v4
      with:
        path: ~/.ccache
        key: ccache:${{ github.job }}:${{ github.ref }}:${{ github.sha }}
        restore-keys: |
          ccache:${{ github.job }}:${{ github.ref }}
          ccache:${{ github.job }}
    - name: Configure Simutrans Build
      run: |
        autoconf
        CC="ccache clang-14" CXX="ccache clang++-14" ./configure
        echo "DEBUG = 2" >> config.default
        echo "FLAGS   += -fsanitize=thread" >> config.default
        echo "LDFLAGS += -fsanitize=thread" >> config.default
    - name: Build Simutrans
      run: |
        CC="ccache clang-14" CXX="ccache clang++-14" make -j$(nproc)
    - name: Install pak128.britain-ex-nightly
      run: |
        pushd simutrans
        printf '2\ni\ny\n' | ../get_pak.sh
        popd
    - name: Link tests as scenario
      run: |
        mkdir -p ./simutrans/pak128.britain-ex-nightly/scenario
        ln -sT $GITHUB_WORKSPACE/tests ./simutrans/pak128.britain-ex-nightly/scenario/automated-tests
    - name: Create simuconf
      run: |
        mkdir -p ~/simutrans/
        echo "frames_per_second = 100"              >> ~/simutrans/simuconf.tab
        echo "fast_forward_frames_per_second = 100" >> ~/simutrans/simuconf.tab
    - name: Run tests
      run: |
        export TSAN_OPTIONS="print_stacktrace=1 second_deadlock_stack=1 history_size=7 verbose=2"
        cp scripts/run-automated-tests.sh .
        chmod +x run-automated-tests.sh
        timeout 10m ./run-automated-tests.sh # 10 minutes ought to be enough for anybody.
